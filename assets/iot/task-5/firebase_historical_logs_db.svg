<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <rect width="800" height="520" fill="#0f172a" />

  <!-- Console Top Nav -->
  <rect width="800" height="50" fill="#1e293b" />
  <text x="30" y="32" fill="#ff2b85" font-family="-apple-system, sans-serif" font-size="14" font-weight="800">🔥 Google Firebase Console</text>
  <text x="230" y="32" fill="#94a3b8" font-family="monospace" font-size="12">praju-portfolio-iot-default-rtdb.firebaseio.com/logs</text>

  <!-- Left Sidebar (Firebase nav) -->
  <rect y="50" width="180" height="470" fill="#111827"/>
  <text x="25" y="85" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">BUILD</text>
  <text x="35" y="115" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Authentication</text>
  <text x="35" y="145" fill="#ff2b85" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Realtime Database</text>
  <text x="35" y="175" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Cloud Storage</text>
  <text x="35" y="205" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Hosting</text>

  <!-- Main Database JSON Tree Area -->
  <g transform="translate(200, 70)">
    <rect width="570" height="420" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    
    <text x="25" y="35" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">▼ praju-portfolio-iot-default-rtdb</text>
    
    <text x="45" y="65" fill="#94a3b8" font-family="monospace" font-size="11">▶ control</text>
    <text x="45" y="90" fill="#94a3b8" font-family="monospace" font-size="11">▶ telemetry</text>
    
    <!-- Expanded logs node -->
    <text x="45" y="120" fill="#00e676" font-family="monospace" font-size="12" font-weight="700">▼ logs</text>

    <!-- Entry 1 -->
    <g transform="translate(70, 140)">
      <text x="0" y="0" fill="#f59e0b" font-family="monospace" font-size="11">▼ 1730272800000</text>
      <text x="20" y="20" fill="#94a3b8" font-family="monospace" font-size="10">humidity: <tspan fill="#38bdf8">61.2</tspan></text>
      <text x="20" y="38" fill="#94a3b8" font-family="monospace" font-size="10">lightIntensity: <tspan fill="#38bdf8">940</tspan></text>
      <text x="20" y="56" fill="#94a3b8" font-family="monospace" font-size="10">mode: <tspan fill="#00e676">"AUTOMATED"</tspan></text>
      <text x="20" y="74" fill="#94a3b8" font-family="monospace" font-size="10">relayState: <tspan fill="#00e676">true</tspan></text>
      <text x="20" y="92" fill="#94a3b8" font-family="monospace" font-size="10">temperature: <tspan fill="#38bdf8">28.4</tspan></text>
    </g>

    <!-- Entry 2 -->
    <g transform="translate(70, 255)">
      <text x="0" y="0" fill="#f59e0b" font-family="monospace" font-size="11">▼ 1730272802500</text>
      <text x="20" y="20" fill="#94a3b8" font-family="monospace" font-size="10">humidity: <tspan fill="#38bdf8">61.3</tspan></text>
      <text x="20" y="38" fill="#94a3b8" font-family="monospace" font-size="10">lightIntensity: <tspan fill="#38bdf8">938</tspan></text>
      <text x="20" y="56" fill="#94a3b8" font-family="monospace" font-size="10">mode: <tspan fill="#00e676">"AUTOMATED"</tspan></text>
      <text x="20" y="74" fill="#94a3b8" font-family="monospace" font-size="10">relayState: <tspan fill="#00e676">true</tspan></text>
      <text x="20" y="92" fill="#94a3b8" font-family="monospace" font-size="10">temperature: <tspan fill="#38bdf8">28.4</tspan></text>
    </g>

    <!-- Entry 3 -->
    <text x="70" y="375" fill="#f59e0b" font-family="monospace" font-size="11">▶ 1730272805000 (5 items)</text>
    <text x="70" y="395" fill="#f59e0b" font-family="monospace" font-size="11">▶ 1730272807500 (5 items)</text>
  </g>
</svg>