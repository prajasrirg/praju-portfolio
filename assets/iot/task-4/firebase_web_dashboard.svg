<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <rect width="800" height="520" fill="#0b0f19" />

  <!-- Window Chrome -->
  <rect x="20" y="20" width="760" height="480" rx="10" fill="#111827" stroke="#374151" stroke-width="2"/>
  <rect x="20" y="20" width="760" height="42" rx="10" fill="#1f2937"/>
  <rect x="20" y="52" width="760" height="10" fill="#1f2937"/>

  <!-- Buttons -->
  <circle cx="42" cy="41" r="5" fill="#ef4444"/>
  <circle cx="58" cy="41" r="5" fill="#eab308"/>
  <circle cx="74" cy="41" r="5" fill="#22c55e"/>

  <text x="100" y="45" fill="#f9fafb" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Firebase IoT Monitoring &amp; Control Dashboard</text>
  <rect x="580" y="29" width="180" height="24" rx="4" fill="#00e676" opacity="0.15"/>
  <text x="670" y="45" fill="#00e676" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">🟢 WSS SECURE SYNCED</text>

  <!-- Metric Cards Grid -->
  <!-- Temp Card -->
  <g transform="translate(50, 90)">
    <rect width="210" height="170" rx="8" fill="#1a2234" stroke="#2d3748" stroke-width="1.5"/>
    <text x="20" y="32" fill="#94a3b8" font-family="monospace" font-size="11">TEMPERATURE</text>
    <text x="20" y="80" fill="#00e676" font-family="-apple-system, sans-serif" font-size="34" font-weight="800">28.4 °C</text>
    <rect x="20" y="105" width="170" height="6" rx="3" fill="#0f172a"/>
    <rect x="20" y="105" width="105" height="6" rx="3" fill="#00e676"/>
    <text x="20" y="135" fill="#64748b" font-family="monospace" font-size="10">Sensor: DHT11 Single-Bus</text>
    <text x="20" y="152" fill="#64748b" font-family="monospace" font-size="10">Update Rate: 2.5s Atomic</text>
  </g>

  <!-- Humidity Card -->
  <g transform="translate(295, 90)">
    <rect width="210" height="170" rx="8" fill="#1a2234" stroke="#2d3748" stroke-width="1.5"/>
    <text x="20" y="32" fill="#94a3b8" font-family="monospace" font-size="11">RELATIVE HUMIDITY</text>
    <text x="20" y="80" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="34" font-weight="800">61.2 %</text>
    <rect x="20" y="105" width="170" height="6" rx="3" fill="#0f172a"/>
    <rect x="20" y="105" width="115" height="6" rx="3" fill="#38bdf8"/>
    <text x="20" y="135" fill="#64748b" font-family="monospace" font-size="10">Transducer: Polymer Capacitive</text>
    <text x="20" y="152" fill="#64748b" font-family="monospace" font-size="10">Tolerance: ±5% RH</text>
  </g>

  <!-- LDR Light Card -->
  <g transform="translate(540, 90)">
    <rect width="210" height="170" rx="8" fill="#1a2234" stroke="#2d3748" stroke-width="1.5"/>
    <text x="20" y="32" fill="#94a3b8" font-family="monospace" font-size="11">OPTICAL INTENSITY (ADC)</text>
    <text x="20" y="80" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="34" font-weight="800">940</text>
    <rect x="20" y="105" width="170" height="6" rx="3" fill="#0f172a"/>
    <rect x="20" y="105" width="60" height="6" rx="3" fill="#f59e0b"/>
    <text x="20" y="135" fill="#f43f5e" font-family="monospace" font-size="10">● DARK (Threshold &lt; 1200)</text>
    <text x="20" y="152" fill="#64748b" font-family="monospace" font-size="10">12-Bit SAR ADC (0–4095)</text>
  </g>

  <!-- Appliance Hybrid Control Panel -->
  <g transform="translate(50, 290)">
    <rect width="700" height="180" rx="8" fill="#1a2234" stroke="#2d3748" stroke-width="1.5"/>
    <text x="30" y="36" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">APPLIANCE CONTROL PLANE &amp; DUAL-MODE CONTROLLER</text>
    
    <!-- Left Box: Mode -->
    <g transform="translate(30, 60)">
      <rect width="300" height="90" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="20" y="30" fill="#94a3b8" font-family="monospace" font-size="10">CURRENT SYSTEM MODE</text>
      <text x="20" y="58" fill="#00e676" font-family="-apple-system, sans-serif" font-size="16" font-weight="800">AUTOMATIC (LDR Trigger)</text>
      <text x="20" y="76" fill="#64748b" font-family="monospace" font-size="9">Ambient &lt; 1200 → Relay Energized</text>
    </g>

    <!-- Right Box: Manual Override -->
    <g transform="translate(360, 60)">
      <rect width="310" height="90" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="20" y="30" fill="#94a3b8" font-family="monospace" font-size="10">MANUAL CLOUD OVERRIDE</text>
      <rect x="20" y="44" width="130" height="32" rx="4" fill="#ff2b85"/>
      <text x="85" y="65" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">TOGGLE RELAY</text>
      <text x="170" y="65" fill="#38bdf8" font-family="monospace" font-size="10">Relay: ACTIVE (ON)</text>
    </g>
  </g>
</svg>