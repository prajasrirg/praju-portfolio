<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="560" fill="#0b0f17" />

  <!-- Browser Window Frame -->
  <g transform="translate(60, 30)" filter="url(#shadow1)">
    <!-- Window Bar -->
    <rect width="680" height="500" rx="12" fill="#121824" stroke="#2a3649" stroke-width="2"/>
    <rect width="680" height="46" rx="12" fill="#1a2232"/>
    <rect y="38" width="680" height="8" fill="#1a2232"/>
    
    <!-- Window Buttons -->
    <circle cx="24" cy="23" r="6" fill="#ef4444"/>
    <circle cx="44" cy="23" r="6" fill="#eab308"/>
    <circle cx="64" cy="23" r="6" fill="#22c55e"/>

    <!-- URL Bar -->
    <rect x="110" y="10" width="460" height="26" rx="6" fill="#0c1017" stroke="#334155" stroke-width="1"/>
    <text x="130" y="27" fill="#38bdf8" font-family="monospace" font-size="11">http://esp32-webserver.local/relay/on</text>
    <text x="540" y="27" fill="#64748b" font-family="monospace" font-size="11">PORT: 80</text>

    <!-- Network Status Pill -->
    <rect x="585" y="11" width="80" height="24" rx="4" fill="#00e676" opacity="0.15"/>
    <text x="625" y="27" fill="#00e676" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">● CONNECTED</text>

    <!-- Web Page Body Render -->
    <g transform="translate(0, 46)">
      <rect width="680" height="454" fill="#0b0f17"/>
      
      <!-- Center Phone/Desktop Card Interface -->
      <g transform="translate(150, 40)">
        <rect width="380" height="370" rx="14" fill="#151c28" stroke="#2d3748" stroke-width="1.8"/>
        
        <!-- Live Status Light Ring -->
        <circle cx="190" cy="55" r="22" fill="#00e676" opacity="0.2"/>
        <circle cx="190" cy="55" r="14" fill="#00e676"/>
        <text x="190" y="60" fill="#0b0f17" font-family="-apple-system, sans-serif" font-size="14" font-weight="900" text-anchor="middle">⚡</text>

        <text x="190" y="105" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" text-anchor="middle">ESP32 Actuator Node</text>
        <text x="190" y="125" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Direct Subnet Socket Control [Port 80]</text>
        
        <!-- Status Box -->
        <rect x="40" y="145" width="300" height="36" rx="6" fill="#0c1017" stroke="#1e293b" stroke-width="1"/>
        <text x="190" y="167" fill="#00e676" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">ACTIVE STATE: GPIO 2 = HIGH (ON)</text>

        <!-- Button ON -->
        <g transform="translate(40, 200)">
          <rect width="300" height="48" rx="8" fill="#00e676" stroke="#00c853" stroke-width="1.5"/>
          <text x="150" y="30" fill="#0b0f17" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="1">⚡ TURN ACTUATOR ON</text>
        </g>

        <!-- Button OFF -->
        <g transform="translate(40, 260)">
          <rect width="300" height="48" rx="8" fill="#ff2b85" stroke="#e01e6e" stroke-width="1.5"/>
          <text x="150" y="30" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="1">🛑 TURN ACTUATOR OFF</text>
        </g>

        <!-- Subnet info footer -->
        <text x="190" y="338" fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">Subnet IP: 192.168.1.105 • mDNS: esp32-webserver.local</text>
        <text x="190" y="352" fill="#475569" font-family="monospace" font-size="9" text-anchor="middle">HTTP/1.1 303 See Other • Handled in 4.2ms</text>
      </g>
    </g>
  </g>
</svg>