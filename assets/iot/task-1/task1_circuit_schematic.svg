<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <pattern id="grid1" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" />
    </pattern>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="460" fill="#090d16" />
  <rect width="800" height="460" fill="url(#grid1)" />

  <!-- Title & Meta -->
  <text x="30" y="42" fill="#00e676" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">TASK 01 // CIRCUIT &amp; WIRING SCHEMATIC</text>
  <text x="30" y="64" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">ESP32 DevKit V1 to 5mm LED via 330Ω Current-Limiting Resistor</text>

  <!-- ESP32 Module Block -->
  <g transform="translate(60, 100)">
    <rect width="220" height="300" rx="10" fill="#131b2c" stroke="#334155" stroke-width="2.5" />
    <rect x="35" y="15" width="150" height="110" rx="6" fill="#0b0f19" stroke="#1e293b" stroke-width="1.5" />
    <!-- ESP32 Chip Metal Can -->
    <rect x="50" y="30" width="120" height="80" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="110" y="65" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">ESP-WROOM-32</text>
    <text x="110" y="82" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">Wi-Fi &amp; Bluetooth</text>
    <text x="110" y="98" fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">Xtensa LX6 240MHz</text>

    <!-- Micro-USB Port -->
    <rect x="80" y="280" width="60" height="20" rx="2" fill="#334155" stroke="#64748b" stroke-width="1" />
    <text x="110" y="294" fill="#94a3b8" font-family="monospace" font-size="8" text-anchor="middle">USB-UART</text>

    <!-- Pins Left / Right -->
    <!-- GPIO 2 Pin on Right -->
    <rect x="210" y="160" width="18" height="12" rx="2" fill="#ff2b85" />
    <text x="200" y="170" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="700" text-anchor="end">GPIO 2 (D2)</text>

    <!-- GND Pin on Right -->
    <rect x="210" y="220" width="18" height="12" rx="2" fill="#38bdf8" />
    <text x="200" y="230" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="700" text-anchor="end">GND (Ground)</text>

    <!-- 3V3 Pin on Right -->
    <rect x="210" y="260" width="18" height="12" rx="2" fill="#f59e0b" />
    <text x="200" y="270" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="700" text-anchor="end">3V3 (VCC)</text>
  </g>

  <!-- Wiring Traces -->
  <!-- GPIO 2 wire to resistor -->
  <path d="M 288 266 L 380 266" fill="none" stroke="#ff2b85" stroke-width="3" stroke-linecap="round" />
  <!-- Resistor Component -->
  <g transform="translate(380, 251)">
    <rect width="100" height="30" rx="4" fill="#1e293b" stroke="#ff2b85" stroke-width="2" />
    <!-- Color Bands (330 Ohm: Orange, Orange, Brown, Gold) -->
    <rect x="20" y="4" width="6" height="22" fill="#f97316" />
    <rect x="35" y="4" width="6" height="22" fill="#f97316" />
    <rect x="50" y="4" width="6" height="22" fill="#854d0e" />
    <rect x="75" y="4" width="6" height="22" fill="#eab308" />
    <text x="50" y="-8" fill="#ff2b85" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">330 Ω Resistor</text>
    <text x="50" y="48" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Current Limiter (3.9mA)</text>
  </g>

  <!-- Wire from resistor to LED Anode -->
  <path d="M 480 266 L 560 266" fill="none" stroke="#ff2b85" stroke-width="3" stroke-linecap="round" />

  <!-- 5mm LED Component -->
  <g transform="translate(560, 216)">
    <!-- Glow -->
    <circle cx="45" cy="50" r="35" fill="rgba(0, 230, 118, 0.15)" filter="url(#glow-green)" />
    <!-- LED Bulb Body -->
    <path d="M 25 50 C 25 25, 65 25, 65 50 L 65 65 L 25 65 Z" fill="#00e676" opacity="0.85" stroke="#f8fafc" stroke-width="1.5" />
    <rect x="22" y="65" width="46" height="6" rx="2" fill="#00e676" />
    <!-- Light Rays -->
    <line x1="68" y1="25" x2="84" y2="15" stroke="#00e676" stroke-width="2" stroke-linecap="round" />
    <line x1="72" y1="38" x2="90" y2="34" stroke="#00e676" stroke-width="2" stroke-linecap="round" />
    <line x1="70" y1="52" x2="88" y2="54" stroke="#00e676" stroke-width="2" stroke-linecap="round" />

    <text x="45" y="10" fill="#00e676" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">5mm Green LED</text>
    <text x="15" y="60" fill="#f8fafc" font-family="monospace" font-size="10">Anode (+)</text>
    <text x="75" y="60" fill="#f8fafc" font-family="monospace" font-size="10">Cathode (-)</text>
  </g>

  <!-- Return Wire from Cathode to GND -->
  <!-- LED Cathode is at x=605, y=282 -->
  <path d="M 605 288 L 605 380 L 288 380 L 288 326" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

  <!-- Breadboard Ground Bus Label -->
  <rect x="360" y="365" width="180" height="28" rx="4" fill="#0b0f19" stroke="#38bdf8" stroke-width="1.5" />
  <text x="450" y="383" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">COMMON GROUND RETURN (GND)</text>

  <!-- Legend & Electrical Specs Box -->
  <g transform="translate(480, 50)">
    <rect width="280" height="120" rx="8" fill="#131b2c" stroke="#334155" stroke-width="1.5" />
    <text x="15" y="24" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">ELECTRICAL CIRCUIT PARAMETERS</text>
    <text x="15" y="46" fill="#94a3b8" font-family="monospace" font-size="10">• ESP32 V_OH (GPIO 2): 3.3V TTL High</text>
    <text x="15" y="66" fill="#94a3b8" font-family="monospace" font-size="10">• LED Forward Voltage (V_f): ~2.0V</text>
    <text x="15" y="86" fill="#94a3b8" font-family="monospace" font-size="10">• Loop Current: (3.3V - 2.0V) / 330Ω ≈ 3.94mA</text>
    <text x="15" y="106" fill="#00e676" font-family="monospace" font-size="10">• Logic: HIGH = Forward Bias | LOW = Off</text>
  </g>
</svg>