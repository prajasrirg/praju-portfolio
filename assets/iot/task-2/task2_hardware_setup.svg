<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <filter id="bulb-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="#090d16" />

  <!-- Title & Meta -->
  <text x="30" y="42" fill="#00e676" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">TASK 02 // HARDWARE INTERFACING &amp; HIGH-VOLTAGE RELAY BENCH</text>
  <text x="30" y="64" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">ESP32 DevKit to Optocoupled 5V Relay Actuating 230V AC Mains Bulb Load</text>

  <!-- Left: ESP32 Board -->
  <g transform="translate(40, 110)">
    <rect width="180" height="280" rx="8" fill="#131b2c" stroke="#334155" stroke-width="2"/>
    <rect x="30" y="20" width="120" height="90" rx="4" fill="#1e293b"/>
    <text x="90" y="65" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">ESP32 DevKit</text>
    <text x="90" y="82" fill="#00e676" font-family="monospace" font-size="9" text-anchor="middle">MQTT Client Node</text>

    <!-- Pins -->
    <rect x="165" y="150" width="18" height="12" fill="#ff2b85"/>
    <text x="155" y="160" fill="#f8fafc" font-family="monospace" font-size="10" text-anchor="end">GPIO 5 (IN)</text>

    <rect x="165" y="190" width="18" height="12" fill="#f59e0b"/>
    <text x="155" y="200" fill="#f8fafc" font-family="monospace" font-size="10" text-anchor="end">VIN (5V DC)</text>

    <rect x="165" y="230" width="18" height="12" fill="#38bdf8"/>
    <text x="155" y="240" fill="#f8fafc" font-family="monospace" font-size="10" text-anchor="end">GND (Common)</text>
  </g>

  <!-- Middle: 1-Channel Relay Module -->
  <g transform="translate(290, 100)">
    <rect width="210" height="300" rx="8" fill="#132438" stroke="#0284c7" stroke-width="2"/>
    <text x="105" y="30" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">5V OPTO-ISOLATED RELAY</text>
    
    <!-- Optocoupler PC817 chip -->
    <rect x="30" y="60" width="40" height="30" rx="2" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <text x="50" y="78" fill="#94a3b8" font-family="monospace" font-size="8" text-anchor="middle">PC817</text>

    <!-- Songle Relay Cube (Blue) -->
    <rect x="30" y="110" width="150" height="100" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="105" y="145" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">SONGLE RELAY</text>
    <text x="105" y="165" fill="#f0f9ff" font-family="monospace" font-size="10" text-anchor="middle">SRD-05VDC-SL-C</text>
    <text x="105" y="185" fill="#bae6fd" font-family="monospace" font-size="9" text-anchor="middle">10A 250VAC / 10A 30VDC</text>

    <!-- Screw Terminal Block on Right (High Voltage) -->
    <rect x="185" y="125" width="22" height="70" rx="3" fill="#15803d" stroke="#22c55e" stroke-width="1"/>
    <circle cx="196" cy="140" r="4" fill="#cbd5e1"/>
    <circle cx="196" cy="160" r="4" fill="#cbd5e1"/>
    <circle cx="196" cy="180" r="4" fill="#cbd5e1"/>
    <text x="175" y="143" fill="#cbd5e1" font-family="monospace" font-size="8" text-anchor="end">NO</text>
    <text x="175" y="163" fill="#cbd5e1" font-family="monospace" font-size="8" text-anchor="end">COM</text>
    <text x="175" y="183" fill="#cbd5e1" font-family="monospace" font-size="8" text-anchor="end">NC</text>

    <!-- Galvanic Isolation Line -->
    <line x1="85" y1="50" x2="85" y2="290" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="80" y="275" fill="#f43f5e" font-family="monospace" font-size="8" text-anchor="end">LOW VOLTAGE</text>
    <text x="90" y="275" fill="#f43f5e" font-family="monospace" font-size="8">230V MAINS ISOLATION</text>
  </g>

  <!-- Wiring from ESP32 to Relay -->
  <path d="M 223 260 L 290 260" stroke="#ff2b85" stroke-width="2.5" fill="none"/>
  <path d="M 223 300 L 290 300" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
  <path d="M 223 340 L 290 340" stroke="#38bdf8" stroke-width="2.5" fill="none"/>

  <!-- Right: 230V AC Mains Bulb Assembly -->
  <g transform="translate(580, 120)">
    <!-- AC Mains Wall Socket Box -->
    <rect x="80" y="220" width="100" height="60" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="130" y="245" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">230V AC MAINS</text>
    <text x="130" y="262" fill="#ef4444" font-family="monospace" font-size="9" text-anchor="middle">50Hz LIVE / NEUTRAL</text>

    <!-- Glowing Incandescent Bulb -->
    <circle cx="130" cy="70" r="45" fill="#fbbf24" opacity="0.35" filter="url(#bulb-glow)"/>
    <!-- Glass Bulb Shape -->
    <path d="M 105 70 C 105 40, 155 40, 155 70 C 155 88, 145 98, 145 110 L 115 110 C 115 98, 105 88, 105 70 Z" fill="#fef08a" opacity="0.9" stroke="#f59e0b" stroke-width="2"/>
    <!-- Bulb Base Brass Screw Thread -->
    <rect x="117" y="110" width="26" height="16" fill="#ca8a04" stroke="#a16207" stroke-width="1"/>
    <!-- Filament -->
    <path d="M 122 75 L 126 55 L 134 55 L 138 75" fill="none" stroke="#dc2626" stroke-width="2.5"/>
    <text x="130" y="20" fill="#fde047" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">AC MAINS BULB (40W)</text>
  </g>

  <!-- High-Voltage Wiring (Live routed through Relay NO/COM) -->
  <!-- Live from mains to COM -->
  <path d="M 660 350 L 500 260" stroke="#ef4444" stroke-width="3" fill="none"/>
  <!-- NO from relay to Bulb base -->
  <path d="M 500 240 L 705 240" stroke="#ea580c" stroke-width="3" fill="none"/>
  <!-- Neutral directly from mains to Bulb base -->
  <path d="M 725 350 L 725 246" stroke="#0284c7" stroke-width="3" fill="none"/>

  <text x="560" y="290" fill="#ef4444" font-family="monospace" font-size="10">LIVE WIRE (Through Relay NO Contact)</text>
  <text x="580" y="400" fill="#0284c7" font-family="monospace" font-size="10">NEUTRAL RETURN DIRECT</text>
</svg>